name: lynxton-partner

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SQL_DSN: ${SQL_DSN:?Set SQL_DSN in deploy/.env}
      PARTNER_SESSION_SECRET: ${PARTNER_SESSION_SECRET:?Set PARTNER_SESSION_SECRET in deploy/.env}
      SESSION_COOKIE_SECURE: "true"
      PARTNER_LISTEN_ADDRESS: 0.0.0.0:3004
    ports:
      - ${PARTNER_BACKEND_BIND_ADDRESS:-0.0.0.0}:${PARTNER_BACKEND_PORT:-3004}:3004
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3004/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - ${PARTNER_BIND_ADDRESS:-127.0.0.1}:${PARTNER_HTTP_PORT:-8081}:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
